<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="author" content="yihang_su" />
    <title>图论画板 · Graph Editor</title>
    <style>
/* Graph Editor - styles */
:root {
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-2: #f7f9fc;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;
  --text: #0f172a;
  --muted: #64748b;
  --muted-2: #94a3b8;
  --accent: #4f46e5;
  --accent-dark: #4338ca;
  --accent-weak: #eef2ff;
  --danger: #dc2626;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}

button,
input,
select,
textarea {
  font-family: inherit;
}

.is-hidden {
  display: none !important;
}

.muted {
  color: var(--muted);
}
.small {
  font-size: 11.5px;
  line-height: 1.7;
}

.app {
  display: flex;
  height: 100vh;
  height: 100dvh;
  width: 100vw;
  overflow: hidden;
}

/* ------------------------------------------------------------------ *
 * editor panel
 * ------------------------------------------------------------------ */

.editor {
  position: relative;
  width: 320px;
  flex: none;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border-right: 1px solid var(--border);
  transition: width 0.2s ease;
  z-index: 12;
}

.editor.is-resizing {
  transition: none;
}

.editor.is-collapsed {
  width: 0 !important;
  border-right: none;
}

.editor.is-collapsed > * {
  display: none;
}

.editor-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 12px 10px;
  gap: 8px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}

.brand-mark {
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: 9px;
  background: radial-gradient(circle at 30% 30%, #818cf8, #4f46e5 70%);
  position: relative;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.28);
}

.brand-mark::before,
.brand-mark::after {
  content: "";
  position: absolute;
  background: #fff;
  border-radius: 50%;
}

.brand-mark::before {
  width: 5px;
  height: 5px;
  left: 7px;
  top: 8px;
  box-shadow: 10px 3px 0 #fff, 6px 11px 0 #fff;
}

.brand-mark::after {
  width: 12px;
  height: 1px;
  background: rgba(255, 255, 255, 0.6);
  left: 8px;
  top: 14px;
  border-radius: 2px;
  transform: rotate(18deg);
}

.brand-name {
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.01em;
}

.brand-sub {
  font-size: 9.5px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin-top: 1px;
}

.head-actions {
  display: flex;
  align-items: center;
  gap: 1px;
}

.icon-btn {
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 8px;
  background: transparent;
  color: #64748b;
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  padding: 0;
}

.icon-btn:hover {
  background: #f1f5f9;
  color: #1e293b;
}

.tabs {
  display: flex;
  gap: 2px;
  padding: 0 12px;
  border-bottom: 1px solid var(--border);
}

.tab {
  flex: 1;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--muted);
  font-size: 12.5px;
  padding: 9px 0 8px;
  cursor: pointer;
}

.tab:hover {
  color: #1e293b;
}

.tab.is-active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

.editor-body {
  flex: 1;
  min-height: 0;
  display: flex;
}

.pane {
  flex: 1;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px;
  overflow-y: auto;
}

#pane-text {
  overflow: hidden;
  gap: 8px;
}

.panel {
  background: var(--surface-2);
  border: 1px solid #eef1f6;
  border-radius: 12px;
  padding: 10px;
}

.panel-grow {
  flex: 1;
  min-height: 120px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  font-weight: 700;
  color: #475569;
  letter-spacing: 0.02em;
  margin-bottom: 8px;
}

.panel-hint {
  font-size: 10.5px;
  font-weight: 500;
  color: var(--muted-2);
}

.field-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 7px;
}

.field-row:first-of-type {
  margin-top: 0;
}

.pref-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 6px;
}

.pref-row .field-label {
  flex: 0 0 42px;
  font-size: 11px;
}

.pref-range {
  flex: 1;
  min-width: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

.pref-number {
  width: 62px;
  flex: none;
  padding: 3px 4px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  color: var(--text);
  font-size: 11px;
  text-align: center;
  outline: none;
}

.pref-number:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.14);
}

.pref-unit {
  font-size: 10px;
  color: var(--muted-2);
  flex: none;
  width: 12px;
}

.pref-subtitle {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid #e8edf5;
  font-size: 10.5px;
  font-weight: 700;
  color: #94a3b8;
  letter-spacing: 0.08em;
}

.pref-note {
  margin-top: 8px;
  font-size: 10px;
  line-height: 1.5;
  color: var(--muted-2);
}

.pref-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 6px;
}

.field-label {
  font-size: 11.5px;
  color: var(--muted);
}

.segmented {
  display: flex;
  gap: 2px;
  padding: 2px;
  border-radius: 9px;
  background: #e8edf5;
}

.segmented button {
  border: none;
  background: transparent;
  color: #475569;
  font-size: 11.5px;
  padding: 4px 9px;
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
}

.segmented button.is-active {
  background: #fff;
  color: var(--accent-dark);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.14);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: #fff;
  color: #334155;
  font-size: 12.5px;
  line-height: 1.2;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease, color 0.12s ease;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--border-strong);
  background: #f8fafc;
}

.btn:active {
  transform: translateY(0.5px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-dark);
  border-color: var(--accent-dark);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--muted);
}

.btn-ghost:hover {
  background: #f1f5f9;
  border-color: transparent;
  color: #1e293b;
}

.btn-danger {
  background: var(--danger);
  border-color: var(--danger);
  color: #fff;
}

.btn-danger:hover {
  background: #b91c1c;
  border-color: #b91c1c;
}

.btn-danger-ghost {
  color: var(--danger);
  border-color: #fecaca;
  background: #fff;
}

.btn-danger-ghost:hover {
  background: #fef2f2;
  border-color: #fca5a5;
}

.btn-sm {
  padding: 6px 8px;
  border-radius: 8px;
  font-size: 11.5px;
}

.btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.selection-body {
  min-height: 24px;
}

.pick-hint {
  color: var(--muted);
  font-size: 10.5px;
  line-height: 1.6;
  margin-bottom: 8px;
}

.pick-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: #334155;
  font-size: 11px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}

.pick-toggle:hover {
  background: #eef2f7;
  border-color: var(--border-strong);
}

.pick-toggle-meta {
  margin-left: auto;
  font-size: 10px;
  font-weight: 400;
  color: var(--muted-2);
}

.pick-chev {
  flex: none;
  font-size: 11px;
  color: var(--muted-2);
  transition: transform 0.15s ease;
}

.pick-toggle.is-open .pick-chev {
  transform: rotate(90deg);
}

.pick-body {
  margin-top: 8px;
}

.pick-group {
  margin-bottom: 10px;
}

.pick-group-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
  font-size: 10.5px;
  font-weight: 700;
  color: #475569;
}

.pick-group-head span:last-child {
  color: var(--muted-2);
  font-weight: 500;
}

.pick-list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  max-height: 150px;
  overflow-y: auto;
  padding-right: 2px;
}

.pick-item {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 7px;
  background: #fff;
  color: #334155;
  font-size: 11px;
  text-align: left;
  cursor: pointer;
}

.pick-item:hover {
  background: #eef2f7;
  border-color: #e2e8f0;
}

.pick-dot {
  width: 8px;
  height: 8px;
  flex: none;
  border-radius: 50%;
  border: 1px solid rgba(15, 23, 42, 0.15);
}

.pick-label {
  font-weight: 600;
  white-space: nowrap;
}

.pick-sub {
  margin-left: auto;
  max-width: 55%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--muted-2);
  font-size: 10px;
}

.pick-more {
  font-size: 10px;
  color: var(--muted-2);
  padding: 3px 4px;
}

.sel-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}

.chip {
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 11px;
  line-height: 1.3;
  background: #fff;
  cursor: pointer;
  white-space: nowrap;
}

.chip:hover {
  filter: brightness(0.97);
}

.chip-point {
  color: #1d4ed8;
  border-color: #bfdbfe;
  background: #eff6ff;
}

.chip-edge {
  color: #0f766e;
  border-color: #99f6e4;
  background: #f0fdfa;
}

.chip-floor {
  color: #6d28d9;
  border-color: #ddd6fe;
  background: #f5f3ff;
}

.chip-more {
  font-size: 10.5px;
  color: var(--muted-2);
  padding: 0 4px;
}

.sel-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 9px;
}

.floor-list {
  position: relative;
  flex: 1;
  min-height: 60px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-right: 2px;
}

.floor-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 5px;
  border: 1px solid transparent;
  border-radius: 8px;
  cursor: pointer;
  min-height: 30px;
}

.floor-row:hover {
  background: #eef2f7;
}

.floor-row.is-active {
  background: var(--accent-weak);
  border-color: #c7d2fe;
}

.floor-row.is-selected {
  box-shadow: inset 0 0 0 1.5px rgba(79, 70, 229, 0.65);
}

.floor-row.is-hidden-floor .floor-name,
.floor-row.is-hidden-floor .floor-desc,
.floor-row.is-hidden-floor .floor-meta {
  opacity: 0.5;
}

.floor-eye {
  width: 22px;
  height: 22px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: #94a3b8;
  cursor: pointer;
  padding: 0;
}

.floor-eye:hover {
  background: #fff;
  color: #4338ca;
}

.floor-eye svg {
  width: 14px;
  height: 14px;
}

.floor-swatch {
  width: 9px;
  height: 9px;
  flex: none;
  border-radius: 50%;
  border: 1px solid rgba(15, 23, 42, 0.12);
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.8) inset;
}

.floor-name {
  font-size: 11.5px;
  font-weight: 600;
  color: #334155;
  white-space: nowrap;
}

.floor-desc {
  flex: 1;
  min-width: 0;
  font-size: 10.5px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.floor-meta {
  font-size: 10px;
  color: var(--muted-2);
  white-space: nowrap;
}

.floor-more {
  font-size: 10.5px;
  color: var(--muted-2);
  text-align: center;
  padding: 5px;
}

.text-tools {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.text-status {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 18px;
  padding: 3px 6px;
  border-radius: 6px;
  font-size: 11px;
  color: var(--muted);
}

.text-status.is-error {
  color: #b91c1c;
  background: #fef2f2;
}

.text-status.is-hint {
  color: #92400e;
  background: #fffbeb;
}

.text-input {
  flex: 1;
  width: 100%;
  min-height: 220px;
  resize: none;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  background: #fbfdff;
  color: #1e293b;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  font-size: 11.5px;
  line-height: 1.65;
  outline: none;
  white-space: pre;
  overflow: auto;
  tab-size: 4;
}

.text-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
}

.editor-resizer {
  position: absolute;
  top: 0;
  right: -3px;
  width: 6px;
  height: 100%;
  cursor: col-resize;
  z-index: 6;
}

.editor-resizer:hover,
.editor.is-resizing .editor-resizer {
  background: rgba(79, 70, 229, 0.22);
}

.expand-handle {
  position: absolute;
  left: 8px;
  top: 10px;
  z-index: 30;
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: rgba(255, 255, 255, 0.95);
  color: #475569;
  font-size: 17px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(15, 23, 42, 0.12);
}

.expand-handle.is-visible {
  display: inline-flex;
}

/* ------------------------------------------------------------------ *
 * stage
 * ------------------------------------------------------------------ */

.stage {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  background: #fbfcfe;
}

#canvas {
  position: absolute;
  inset: 0;
  display: block;
  outline: none;
  touch-action: none;
  user-select: none;
}

.hud {
  position: absolute;
  top: 10px;
  right: 12px;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 11px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.84);
  border: 1px solid rgba(226, 232, 240, 0.95);
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
  font-size: 10.5px;
  color: var(--muted);
  pointer-events: none;
  z-index: 8;
  backdrop-filter: blur(8px);
}

.hud b {
  color: var(--text);
  font-weight: 600;
}

.hud-sel {
  color: var(--accent);
}

.hud-sel b {
  color: var(--accent);
}

.hud-fps {
  color: var(--muted-2);
}

.empty-state {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  z-index: 5;
}

.empty-card {
  pointer-events: auto;
  width: min(430px, 84%);
  padding: 26px 28px 24px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid #e2e8f0;
  box-shadow: 0 20px 55px rgba(15, 23, 42, 0.1);
  text-align: center;
  backdrop-filter: blur(6px);
}

.empty-kicker {
  font-size: 9.5px;
  letter-spacing: 0.2em;
  font-weight: 700;
  color: #6366f1;
}

.empty-title {
  font-size: 22px;
  font-weight: 700;
  margin: 8px 0 6px;
  letter-spacing: -0.01em;
}

.empty-card p {
  margin: 0 0 16px;
  color: var(--muted);
  font-size: 12.5px;
}

.empty-actions {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
}

.toast-wrap {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  z-index: 60;
  pointer-events: none;
}

.toast {
  background: rgba(15, 23, 42, 0.92);
  color: #fff;
  font-size: 11.5px;
  padding: 7px 14px;
  border-radius: 999px;
  box-shadow: 0 8px 24px rgba(15, 23, 42, 0.22);
  animation: toast-in 0.18s ease both;
  max-width: 70vw;
}

.toast.is-error {
  background: #b91c1c;
}

.toast.is-warn {
  background: #b45309;
}

.toast.is-leaving {
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

@keyframes toast-in {
  from {
    opacity: 0;
    transform: translateY(-6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.canvas-tip {
  position: absolute;
  top: 0;
  left: 0;
  max-width: 290px;
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.97);
  border: 1px solid #e2e8f0;
  box-shadow: 0 12px 34px rgba(15, 23, 42, 0.14);
  color: #334155;
  font-size: 11.5px;
  line-height: 1.5;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
  z-index: 25;
  will-change: transform;
}

.canvas-tip.is-visible {
  opacity: 1;
}

.tip-title {
  font-weight: 700;
  color: #0f172a;
  font-size: 12px;
  margin-bottom: 1px;
}

.tip-sub {
  color: var(--muted);
  font-size: 10.5px;
  margin-bottom: 3px;
}

.tip-row {
  margin-top: 1px;
  word-break: break-word;
}

/* ------------------------------------------------------------------ *
 * layer bar
 * ------------------------------------------------------------------ */

.layer-bar {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.95);
  border: 1px solid var(--border);
  box-shadow: 0 12px 34px rgba(15, 23, 42, 0.13);
  z-index: 10;
  backdrop-filter: blur(8px);
}

.lb-btn {
  width: 26px;
  height: 26px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: #fff;
  color: #475569;
  font-size: 15px;
  line-height: 1;

.lb-btn:hover {

  color: #1e293b;
}

.floor-slider {
  width: 190px;
  accent-color: var(--accent);

}

.floor-input-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
}

.floor-input-wrap input {
  width: 58px;
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 7px;
  font-size: 12px;
  text-align: center;
  color: var(--text);
  background: #fff;
  outline: none;
}

.floor-input-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.14);
}

.floor-current-desc {
  max-width: 150px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 10.5px;
  color: var(--muted);
}

.floor-total {
  font-size: 10.5px;
  color: var(--muted-2);
  white-space: nowrap;
}

/* ------------------------------------------------------------------ *
 * toolbar
 * ------------------------------------------------------------------ */

.toolbar {
  width: 58px;
  flex: none;
  padding: 10px 7px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  overflow-y: auto;
  z-index: 15;
}

.tool {
  width: 40px;
  height: 40px;
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: #475569;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}

.tool:hover {
  background: #f1f5f9;
  color: #1e293b;
}

.tool.is-active {
  background: var(--accent-weak);
  color: var(--accent-dark);
  border-color: #c7d2fe;
}

.tool:disabled {
  opacity: 0.32;
  cursor: not-allowed;
  background: transparent;
  color: #475569;
}

.tool-sep {
  width: 26px;
  height: 1px;
  flex: none;
  background: var(--border);
  margin: 4px 0;
}

/* ------------------------------------------------------------------ *
 * modal
 * ------------------------------------------------------------------ */

.modal-root {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(15, 23, 42, 0.34);
  backdrop-filter: blur(2px);
  opacity: 0;
  transition: opacity 0.16s ease;
  pointer-events: auto;
}

.modal-backdrop.is-in {
  opacity: 1;
}

.modal-backdrop.is-leaving {
  opacity: 0;
}

.modal {
  width: min(520px, 92vw);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 30px 90px rgba(15, 23, 42, 0.3);
  overflow: hidden;
  transform: translateY(8px) scale(0.985);
  transition: transform 0.18s ease;
}

.modal-backdrop.is-in .modal {
  transform: none;
}

.modal-wide {
  width: min(720px, 94vw);
}

.modal-xwide {
  width: min(920px, 96vw);
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 13px 16px;
  border-bottom: 1px solid #f1f5f9;
}

.modal-head h2 {
  margin: 0;
  font-size: 14.5px;
  font-weight: 700;
}

.modal-close {
  flex: none;
}

.modal-body {
  padding: 16px;
  overflow-y: auto;
  font-size: 12.5px;
}

.modal-foot {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 12px 16px;
  border-top: 1px solid #f1f5f9;
  background: #fbfcfe;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 10px;
}

.field .field-label {
  font-size: 11.5px;
  font-weight: 600;
  color: #475569;
}

.field-hint {
  font-size: 10.5px;
  color: var(--muted-2);
}

.input {
  width: 100%;
  padding: 7px 9px;
  border: 1px solid #dbe2ec;
  border-radius: 8px;
  background: #fff;
  color: var(--text);
  font-size: 12.5px;
  outline: none;
}

.input-static {

  align-items: center;
  min-height: 33px;

  background: #f8fafc;

  user-select: none;
}

.input:focus {

}

.input[readonly] {
  background: #f8fafc;
  color: var(--muted);
}

.input-color {

  padding: 2px;
  cursor: pointer;
}

.form-grid {

}

.form-error {

  margin-bottom: 10px;
  padding: 7px 9px;
  border: 1px solid #fecaca;
  border-radius: 8px;
  background: #fef2f2;
  color: #b91c1c;

.form-error.is-visible {

}

.form-note {

.check-row {

  color: #334155;

.check-row label {

  cursor: pointer;
}

.confirm-text {
  margin: 0;
  font-size: 13px;

}

.link-btn {

  background: transparent;

  text-decoration: underline;

/* guide */

    <script>
/* ===== js/parser.js ===== */
/* Graph Editor - TXT document parser & serializer
 *
 * Document grammar (tolerant while typing, strict when `final`):
 *   [#pointnumber 0|1 [#floornumber 0|1]]
 *   N M [F]
 *   M edge lines : a b [fa fb] dir [weight] [color] [desc...]
 *   N point lines: P [weight] [floor] [color] [desc...]
 *   F floor lines: F [0|1] [desc...]
 */
(function (GE) {
  'use strict';

  const U = GE.U;

  function tokenize(line) {
    const tokens = [];
    let i = 0;
    const n = line.length;
    while (i < n) {
      const c = line.charAt(i);
      if (c === ' ' || c === '\t') {
        i++;
        continue;
      }
      const start = i;
      while (i < n) {
        const ch = line.charAt(i);
        if (ch === ' ' || ch === '\t') break;
        i++;
      }
      tokens.push({ text: line.slice(start, i), start: start, end: i });
    }
    return tokens;
  }

  function firstToken(line) {
    const t = tokenize(line);
    return t.length ? t[0].text : '';
  }

  function restOfLine(line, tokens, idx) {
    if (idx >= tokens.length) return '';
    return line.slice(tokens[idx].start).replace(/[ \t]+$/, '');
  }

  function parseEdgeLine(line, li, ctx) {
    const toks = tokenize(line);
    const need = ctx.floorCount > 1 ? 5 : 3;
    if (toks.length < need) {
      return {
        missing: true,
        message:
          '边行内容不足，至少需要 ' +
          need +
          ' 个字段：起点 终点' +
          (ctx.floorCount > 1 ? ' 起点层 终点层' : '') +
          ' 方向',
      };
    }
    let i = 0;
    const aTok = toks[i++].text;
    const bTok = toks[i++].text;
    if (!U.isIntToken(aTok) || !U.isIntToken(bTok)) {
      return { error: '边的起点与终点编号必须是整数' };
    }
    const aDisp = U.int(aTok);
    const bDisp = U.int(bTok);
    if (aDisp < ctx.pointStart || aDisp > ctx.pointStart + ctx.pointCount - 1) {
      return { error: '起点编号 ' + aDisp + ' 超出范围（应为 ' + ctx.pointStart + ' ~ ' + (ctx.pointStart + ctx.pointCount - 1) + '）' };
    }
    if (bDisp < ctx.pointStart || bDisp > ctx.pointStart + ctx.pointCount - 1) {
      return { error: '终点编号 ' + bDisp + ' 超出范围（应为 ' + ctx.pointStart + ' ~ ' + (ctx.pointStart + ctx.pointCount - 1) + '）' };
    }
    const a = aDisp - ctx.pointStart;
    const b = bDisp - ctx.pointStart;

    let fA = ctx.singleFloor ? 0 : -1;
    let fB = ctx.singleFloor ? 0 : -1;
    let fADisp = 0;
    let fBDisp = 0;
    if (ctx.floorCount > 1) {
      const faTok = toks[i++].text;
      const fbTok = toks[i++].text;
      if (!U.isIntToken(faTok) || !U.isIntToken(fbTok)) {
        return { error: '起点层与终点层的层号必须是整数' };
      }
      fADisp = U.int(faTok);
      fBDisp = U.int(fbTok);
      if (fADisp < ctx.floorStart || fADisp > ctx.floorStart + ctx.floorCount - 1) {
        return { error: '起点层号 ' + fADisp + ' 超出范围（应为 ' + ctx.floorStart + ' ~ ' + (ctx.floorStart + ctx.floorCount - 1) + '）' };
      }
      if (fBDisp < ctx.floorStart || fBDisp > ctx.floorStart + ctx.floorCount - 1) {
        return { error: '终点层号 ' + fBDisp + ' 超出范围（应为 ' + ctx.floorStart + ' ~ ' + (ctx.floorStart + ctx.floorCount - 1) + '）' };
      }
      fA = fADisp - ctx.floorStart;
      fB = fBDisp - ctx.floorStart;

    if (!U.isIntToken(dirTok)) return { error: '方向标记必须是 0（无向）或 1（有向）' };

    const pb = ctx.graph.points.get(b);

      }
      if (pb.floor === -1) pb.floor = fB;
      else if (pb.floor !== fB) {
        return { error: '节点 ' + bDisp + ' 的层级与文中已声明的不一致（第 ' + ctx.graph.floorDisp(pb.floor) + ' 层 vs 第 ' + fBDisp + ' 层）' };

      id: ctx.graph.allocEdgeId(),

      weight: weight,
      color: color,

  }

  function parsePointLine(line, li, ctx, idx) {
    const toks = tokenize(line);
    if (!toks.length || toks[0].text !== 'P') return { error: '点属性行必须以 P 开头' };

    let weight = null;
    let floorDisp = null;
    let floorInternal = -1;

    if (ctx.floorCount > 1) {
      if (i >= toks.length) return { missing: true, message: '缺少点的层级' };
      const t = toks[i].text;
      if (t.charAt(0) === '(') {
        const w = U.parseWeight(t);
        if (!w.ok) return { error: '点权格式错误：应为整数、浮点数或 (a,b,...) 形式' };

        i++;
      } else if (U.isNumberToken(t)) {
        if (i + 1 < toks.length && U.isIntToken(toks[i + 1].text)) {

          if (!w.ok) return { error: '点权格式错误：应为整数、浮点数或 (a,b,...) 形式' };
          weight = w.value;
          i++;

    if (i < toks.length && U.isColorToken(toks[i].text)) {
      color = U.normColor(toks[i].text);
      i++;
    }

    if (!p) return { error: '点属性行数量超出点的总数' };

    p.color = color;

  function parseFloorLine(line, li, ctx, idx) {

    let visible = true;
    if (i < toks.length && (toks[i].text === '0' || toks[i].text === '1')) {
      visible = toks[i].text === '1';
      i++;

    let color = U.DEFAULT_LAYER_COLOR;
    if (i < toks.length && U.isColorToken(toks[i].text)) {
      color = U.normColor(toks[i].text);
      i++;
    }

    f.color = color;
    f.desc = desc;

        if (li === softIndex) {
          incomplete = true;
          break;
        }

      }

      readEdges++;

            return hardFail(Math.max(0, lines.length - 1), '点属性行数量不足：应为 ' + pointCount + ' 行，实际 ' + readPoints + ' 行');
          }
          incomplete = true;
          break;
        }
        if (firstToken(lines[li]) !== 'P') break;
        const res = parsePointLine(lines[li], li, ctx, readPoints);
        if (res.missing || res.error) {
          if (li === softIndex) {
            incomplete = true;
            break;
          }
          return hardFail(li, res.missing ? res.message : res.error);
        }
        li++;
        readPoints++;
      }
      if (readPoints > 0 && readPoints < pointCount && !incomplete) {
        if (finalMode) {
          return hardFail(li, '点属性行数量不足：应为 ' + pointCount + ' 行，实际 ' + readPoints + ' 行');
        }
        incomplete = true;
      }
    }

    /* -------- floor lines -------- */
    skipBlank();
    let readFloors = 0;
    const hasFloorRows = li < lines.length && firstToken(lines[li]) === 'F';
    if (hasFloorRows) {
      while (readFloors < floorCount) {
        skipBlank();

            return hardFail(Math.max(0, lines.length - 1), '层属性行数量不足：应为 ' + floorCount + ' 行，实际 ' + readFloors + ' 行');

        if (res.error) {

            incomplete = true;
            break;
          }
          return hardFail(li, res.error);
        }
        li++;
        readFloors++;
      }
      if (readFloors > 0 && readFloors < floorCount && !incomplete) {
        if (finalMode) {
          return hardFail(li, '层属性行数量不足：应为 ' + floorCount + ' 行，实际 ' + readFloors + ' 行');
        }
        incomplete = true;
      }

    spring: 0.028,
    restLength: 112,
    damping: 0.86,

    repulsion: { min: 0, max: 30000, step: 500 },
    spring: { min: 0.004, max: 0.08, step: 0.002 },

    let maxY = -Infinity;

      if (p.y > maxY) maxY = p.y;

      y0: minY,

      cy: 0,

      node.pts = points;

      let sy = 0;

        b.fy -= fy;

      ctx.moveTo(0, sy + 0.5);
      ctx.lineTo(scene.W, sy + 0.5);
      ctx.stroke();
    }
  }

  function edgeLabel(e) {
    let text = '';
    if (e.weight != null) text = U.weightText(e.weight);
    if (e.desc) text += (text ? ' ' : '') + U.truncate(e.desc, 5);
    return text;
  }

  function edgeStrokeWidth(base, selected, hovered) {
    if (hovered) return Math.max(base + 1.2, 2.8);
    if (selected) return Math.max(base + 0.8, 2.4);
    return base;
  }

  function edgeArrowSize(base, zoom) {
    const z = Math.max(0.5, Math.min(8, zoom == null ? 1 : zoom));
    // Keep the arrow proportional to the line width (not a fixed +6px),
    // then scale it with the current zoom.
    return Math.max(6, Math.min(80, Math.max(6, base * 2.6) * z));
  }

  function drawEdge2D(ctx, scene, app, e, aS, bS, rA, rB, selected, hovered) {
    const color = hovered ? THEME.hover : selected ? THEME.accent : e.color || THEME.edge;
    const baseW = scene.edgeWidth;
    const width = edgeStrokeWidth(baseW, selected, hovered);
    const arrow = edgeArrowSize(baseW, scene.cam.scale);
    const a = app.graph.points.get(e.a);
    const b = app.graph.points.get(e.b);
    if (!a || !b) return;

    if (e.a === e.b) {
      const r = Math.min(rA, rB);
      ctx.beginPath();
      ctx.arc(aS.x, aS.y - r * 1.25, r * 0.92, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();
      if (e.directed) {
        const cy = aS.y - r * 1.25;
        const rr = r * 0.92;
        const ang = -Math.PI / 4;
        const ax = aS.x + Math.cos(ang) * rr;
        const ay = cy + Math.sin(ang) * rr;
        drawArrow(
          ctx,
          ax,
          ay,
          ang + Math.PI / 2,
          Math.max(arrow, Math.min(64, rr * 0.35 * (0.7 + baseW / 10))),
          color
        );
      }
      if (scene.showEdgeLabels) {
        const label = edgeLabel(e);
        if (label) {
          drawPill(ctx, label, aS.x, aS.y - r * 2.17 - 12, {
            fontSize: 10,
            color: selected ? THEME.accent : THEME.muted,
          });
        }
      }
      return;
    }

    let dx = bS.x - aS.x;
    let dy = bS.y - aS.y;
    let d = Math.hypot(dx, dy);
    if (d < 1) return;
    const ux = dx / d;
    const uy = dy / d;
    const trimA = Math.min(rA + 1, d * 0.45);
    // Thicker strokes get a slightly smaller node gap so the arrow visually
    // moves forward toward the target; thin lines keep the 5px breathing gap.
    const arrowGap = Math.max(0, 5 - (baseW - 2) * 0.5);
    const trimB = Math.min(rB + arrowGap, d * 0.45);
    const x1 = aS.x + ux * trimA;
    const y1 = aS.y + uy * trimA;
    const x2 = bS.x - ux * trimB;
    const y2 = bS.y - uy * trimB;

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.setLineDash([]);
    ctx.stroke();

    if (e.directed) {
      drawArrow(ctx, x2, y2, Math.atan2(dy, dx), arrow + (selected ? 1 : 0), color);
    }

    if (scene.showEdgeLabels) {
      const label = edgeLabel(e);
      if (label) {
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        const nx = -uy;
        const ny = ux;
        const off = Math.max(11, scene.edgeWidth * 0.6 + 6);
        drawPill(ctx, label, mx + nx * off, my + ny * off, {
          fontSize: Math.max(9, Math.min(13, 8 + scene.cam.scale * 1.6)),
          color: selected ? THEME.accent : THEME.muted,
          padX: 5,
          padY: 2,
          bg: 'rgba(255,255,255,0.82)',
        });
      }
    }
  }

  function drawStub2D(ctx, scene, app, e, p, other, selected, hovered, center, angleOffset) {
    const g = app.graph;
    const pS = scene.project(p.x, p.y, 0);
    /* Point away from the layer's centre instead of toward the remote endpoint.
       A stub aimed at the remote node can run on top of a real edge; an
       outward stub + drawing underneath normal edges keeps the graph readable. */
    let dx = p.x - center.x;
    let dy = p.y - center.y;
    let d = Math.hypot(dx, dy);
    if (d < 0.001) {
      const ang = (p.id * 2.399963) % (Math.PI * 2);
      dx = Math.cos(ang);
      dy = Math.sin(ang);
      d = 1;
    }
    let ux = dx / d;
    let uy = dy / d;
    if (angleOffset) {
      const co = Math.cos(angleOffset);
      const si = Math.sin(angleOffset);
      const rx = ux * co - uy * si;
      const ry = ux * si + uy * co;
      ux = rx;
      uy = ry;
    }
    const nodeR = scene.nodeRadius * scene.cam.scale;
    const startX = pS.x + ux * (nodeR + 2);
    const startY = pS.y + uy * (nodeR + 2);
    const maxLen = Math.max(10, nodeR * 2.6);
    let len = maxLen;
    const margin = 18;
    if (ux > 0) len = Math.min(len, (scene.W - margin - startX) / ux);
    else if (ux < 0) len = Math.min(len, (margin - startX) / ux);
    if (uy > 0) len = Math.min(len, (scene.H - margin - startY) / uy);
    else if (uy < 0) len = Math.min(len, (margin - startY) / uy);
    if (!isFinite(len) || len < 12) return;
    const endX = startX + ux * len;
    const endY = startY + uy * len;
    const color = hovered ? THEME.hover : selected ? THEME.accent : U.rgba(e.color || '#475569', 0.75);
    const dash = Math.max(3, nodeR * 0.22);
    ctx.setLineDash([dash, dash * 0.7]);
    ctx.beginPath();
    ctx.moveTo(startX, startY);
    ctx.lineTo(endX, endY);
    ctx.strokeStyle = color;
    const baseW = scene.edgeWidth;
    const stubW = baseW;
    ctx.lineWidth = hovered || selected ? Math.max(stubW + 0.8, 2.4) : stubW;
    ctx.stroke();
    ctx.setLineDash([]);
    const arrowSize = Math.max(baseW * 1.8, nodeR * 0.18 * (0.7 + baseW / 10));
    drawArrow(ctx, endX, endY, Math.atan2(uy, ux), arrowSize, color);
    const label = '层 ' + g.floorDisp(other.floor);
    const badgeFont = Math.max(8, nodeR * 0.24);
    const badgeOffset = Math.max(10, nodeR * 0.45);
    const badge = drawPill(ctx, label, endX - ux * badgeOffset, endY - uy * badgeOffset, {
      fontSize: badgeFont,
      color: selected ? THEME.accent : THEME.muted,
      stroke: selected ? THEME.accent : 'rgba(148,163,184,0.55)',
      padX: 5,
      padY: 2,
    });
    scene.stubHits.push({
      edgeId: e.id,
      x1: startX,
      y1: startY,
      x2: endX,
      y2: endY,
      badge: badge,
    });
  }

  function drawNode2D(ctx, scene, app, p, sx, sy, r) {
    const g = app.graph;
    const selected = app.sel.has('p:' + p.id);
    const hovered = app.hover && app.hover.type === 'point' && app.hover.id === p.id;
    const fill = p.color || '#000000';
    if (r >= 0.8) {
      if (selected) {
        ctx.beginPath();
        ctx.arc(sx, sy, r * 1.18, 0, Math.PI * 2);
        ctx.strokeStyle = THEME.accent;
        ctx.lineWidth = Math.max(2, r * 0.09);
        ctx.stroke();
      }
      if (hovered) {
        ctx.beginPath();
        ctx.arc(sx, sy, r * 1.26, 0, Math.PI * 2);
        ctx.strokeStyle = THEME.hover;
        ctx.lineWidth = Math.max(1.5, r * 0.06);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.strokeStyle = U.luminance(fill) > 0.8 ? '#cbd5e1' : 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    scene.nodeHits.push({ id: p.id, x: sx, y: sy, r: Math.max(r + 4, 6) });

    if (r >= 6) {
      const idText = String(g.pointDisp(p.id));
      const fs = Math.min(34, Math.max(7, r * 0.58));
      ctx.font = font(fs, 600);
      const tw = ctx.measureText(idText).width;
      const shrink = Math.min(1, (r * 1.55) / Math.max(1, tw));
      const size = Math.max(6, fs * shrink);
      ctx.font = font(size, 600);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = U.contrastText(fill);
      const hasWeight = p.weight != null;
      const yOff = hasWeight && r >= 11 ? -r * 0.16 : 0;
      ctx.fillText(idText, sx, sy + yOff);
      if (hasWeight && r >= 11) {
        ctx.font = font(Math.max(6, Math.min(22, r * 0.32)), 500);
        ctx.fillStyle = U.contrastText(fill);
        ctx.globalAlpha = 0.92;
        ctx.fillText(U.weightText(p.weight), sx, sy + r * 0.46);
        ctx.globalAlpha = 1;
      }
    }
    if (r >= 9 && p.desc) {
      const df = Math.min(18, Math.max(9, r * 0.32));
      haloText(ctx, U.truncate(p.desc, 5), sx, sy + r + df * 0.9, THEME.muted, df, 500);
    }
  }

  function drawFloorBadge2D(ctx, scene, app, fid) {
    const g = app.graph;
    const floor = g.floors.get(fid);
    if (!floor) return;
    const desc = floor.desc ? ' · ' + U.truncate(floor.desc, 14) : '';
    const text = '层 ' + g.floorDisp(fid) + desc;
    const color = floor.color || U.DEFAULT_LAYER_COLOR;
    const badge = drawPill(ctx, text, 84, 26, {
      fontSize: 12,
      color: '#1e293b',
      bg: U.rgba(color, 0.11),
      stroke: U.rgba(color, 0.52),
      padX: 18,
      padY: 6,
    });
    ctx.beginPath();
    ctx.arc(badge.x + 9, badge.y + badge.h / 2, 3.4, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    scene.floorBadges.push({ id: fid, x: badge.x, y: badge.y, w: badge.w, h: badge.h });
  }

  function draw2D(app, ctx, scene, view, opts) {
    const g = app.graph;
    const idx = g.getIndex();
    let floors = [];
    let transition = null;
    if (!opts.exporting && view.transition) {
      const t = U.clamp((U.now() - view.transition.start) / view.transition.dur, 0, 1);
      const eased = t * t * (3 - 2 * t);
      if (t >= 1) {
        view.transition = null;
      } else {
        transition = { t: t, eased: eased };
      }
    }
    if (!transition) {
      floors = [{ id: view.currentFloor, alpha: 1, yOff: 0, primary: true }];
    } else {
      floors = [
        { id: view.transition.from, alpha: 1 - transition.eased, yOff: -14 * transition.eased, primary: false },
        { id: view.transition.to, alpha: transition.eased, yOff: 14 * (1 - transition.eased), primary: true },
      ];
    }

    for (let fi = 0; fi < floors.length; fi++) {
      const ent = floors[fi];
      if (!g.floors.has(ent.id)) continue;
      const pts = idx.byFloor.get(ent.id) || [];
      const edges = idx.edgesByFloor.get(ent.id) || [];
      const cross = idx.crossByFloor.get(ent.id) || [];
      const scale = scene.cam.scale;
      let labelBudget = 0;
      if (scale >= 1.2) labelBudget = 6000;
      else if (scale >= 0.8) labelBudget = 1200;
      else if (scale >= 0.45) labelBudget = 120;
      scene.showEdgeLabels = labelBudget > 0 && edges.length <= labelBudget;
      ctx.globalAlpha = ent.alpha;
      const yOff = ent.yOff;

      /* cross-layer stubs are drawn first so real edges always stay on top */
      const center = { x: 0, y: 0 };
      let centerCount = 0;
      for (let i = 0; i < pts.length; i++) {
        const q = pts[i];
        if (q.x == null || q.y == null) continue;
        center.x += q.x;
        center.y += q.y;
        centerCount++;
      }
      if (centerCount) {
        center.x /= centerCount;
        center.y /= centerCount;
      }
      let stubDrawn = 0;
      const stubGroups = new Map();
      for (let i = 0; i < cross.length; i++) {
        const e = cross[i];
        const pa = g.points.get(e.a);
        const pb = g.points.get(e.b);
        if (!pa || !pb) continue;
        let local = null;
        let other = null;
        if (pa.floor === ent.id) {
          local = pa;
          other = pb;
        } else if (pb.floor === ent.id) {
          local = pb;
          other = pa;
        }
        if (!local || !other) continue;
        let arr = stubGroups.get(local.id);
        if (!arr) {
          arr = [];
          stubGroups.set(local.id, arr);
        }
        arr.push({ e: e, local: local, other: other });
      }
      for (const items of stubGroups.values()) {
        const local = items[0].local;
        const step = Math.min(0.38, 1.4 / Math.max(1, items.length));
        for (let k = 0; k < items.length; k++) {
          if (stubDrawn >= 3000) break;
          const item = items[k];
          const selected = app.sel.has('e:' + item.e.id);
          const hovered = app.hover && app.hover.type === 'edge' && app.hover.id === item.e.id;
          if (ent.primary) {
            const offset = items.length > 1 ? (k - (items.length - 1) / 2) * step : 0;
            drawStub2D(ctx, scene, app, item.e, local, item.other, selected, hovered, center, offset);
            stubDrawn++;
          }
        }
      }

      /* edges */
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const a = g.points.get(e.a);
        const b = g.points.get(e.b);
        if (!a || !b) continue;
        const aS = scene.project(a.x, a.y, 0);
        const bS = scene.project(b.x, b.y, 0);
        aS.y += yOff;
        bS.y += yOff;
        const m = 60;
        if (
          (aS.x < -m && bS.x < -m) ||
          (aS.x > scene.W + m && bS.x > scene.W + m) ||
          (aS.y < -m && bS.y < -m) ||
          (aS.y > scene.H + m && bS.y > scene.H + m)
        ) {
          continue;
        }
        const selected = app.sel.has('e:' + e.id);
        const hovered = app.hover && app.hover.type === 'edge' && app.hover.id === e.id;
        if (ent.primary) {
          scene.showEdgeLabels = scene.showEdgeLabels;
        }
        drawEdge2D(
          ctx,
          scene,
          app,
          e,
          aS,
          bS,
          scene.nodeRadius * scale,
          scene.nodeRadius * scale,
          selected,
          hovered
        );
      }

      /* nodes */
      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const s = scene.project(p.x, p.y, 0);
        const sx = s.x;
        const sy = s.y + yOff;
        const r = scene.nodeRadius * scale;
        if (sx < -r - 80 || sx > scene.W + r + 80 || sy < -r - 80 || sy > scene.H + r + 80) continue;
        drawNode2D(ctx, scene, app, p, sx, sy, r);
      }
      ctx.globalAlpha = 1;
    }

    const primary = floors.find(function (f) {
      return f.primary && f.alpha > 0.5;
    });
    if (primary && g.floors.has(primary.id)) {
      drawFloorBadge2D(ctx, scene, app, primary.id);
    }
  }

  /* ------------------------------------------------------------------ *
   * 3D drawing
   * ------------------------------------------------------------------ */

  function contentBounds3D(scene, app) {
    const g = app.graph;
    const idx = g.getIndex();
    let minX = Infinity;
    let minY = Infinity;
    let maxX = -Infinity;
    let maxY = -Infinity;
    let minZ = Infinity;
    let maxZ = -Infinity;
    let count = 0;
    for (let i = 0; i < idx.floors.length; i++) {
      const f = idx.floors[i];
      if (!scene.visibleFloors.has(f.id)) continue;
      const z = scene.floorZ.get(f.id);
      if (z < minZ) minZ = z;
      if (z > maxZ) maxZ = z;
      const pts = idx.byFloor.get(f.id) || [];
      for (let j = 0; j < pts.length; j++) {
        const p = pts[j];
        count++;
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
    }
    if (!count) {
      minX = -180;
      maxX = 180;
      minY = -180;
      maxY = 180;
    }
    if (!isFinite(minZ)) {
      minZ = 0;
      maxZ = 0;
    }
    const pad = 110;
    return {
      minX: minX - pad,
      maxX: maxX + pad,
      minY: minY - pad,
      maxY: maxY + pad,
      minZ: minZ,
      maxZ: maxZ,
      empty: !count,
    };
  }

  function drawPlane3D(ctx, scene, b, z, active, includeGrid, lite, color) {
    const p1 = scene.project(b.minX, b.minY, z);
    const p2 = scene.project(b.maxX, b.minY, z);
    const p3 = scene.project(b.maxX, b.maxY, z);
    const p4 = scene.project(b.minX, b.maxY, z);
    if (!p1 || !p2 || !p3 || !p4) return;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.lineTo(p4.x, p4.y);
    ctx.closePath();
    if (!lite || active) {
      ctx.fillStyle = U.rgba(color, active ? 0.16 : 0.055);
      ctx.fill();
    }
    ctx.strokeStyle = U.rgba(color, active ? 0.85 : 0.32);
    ctx.lineWidth = active ? 1.8 : 1;
    ctx.stroke();

    if (includeGrid) {
      const n = 4;
      ctx.strokeStyle = U.rgba(color, active ? 0.16 : 0.1);
      ctx.lineWidth = 1;
      for (let i = 1; i < n; i++) {
        const fx = b.minX + ((b.maxX - b.minX) * i) / n;
        const fy = b.minY + ((b.maxY - b.minY) * i) / n;
        const a1 = scene.project(fx, b.minY, z);
        const a2 = scene.project(fx, b.maxY, z);
        if (a1 && a2) {
          ctx.beginPath();
          ctx.moveTo(a1.x, a1.y);
          ctx.lineTo(a2.x, a2.y);
          ctx.stroke();
        }
        const b1 = scene.project(b.minX, fy, z);
        const b2 = scene.project(b.maxX, fy, z);
        if (b1 && b2) {
          ctx.beginPath();
          ctx.moveTo(b1.x, b1.y);
          ctx.lineTo(b2.x, b2.y);
          ctx.stroke();
        }
      }
    }
  }

  function draw3D(app, ctx, scene, view, opts) {
    const g = app.graph;
    const idx = g.getIndex();
    const b = contentBounds3D(scene, app);
    const includeGrid = opts.includeGrid != null ? opts.includeGrid : view.showGrid;

    /* planes, far to near */
    const planes = [];
    for (let i = 0; i < idx.floors.length; i++) {
      const f = idx.floors[i];
      if (!scene.visibleFloors.has(f.id)) continue;
      const z = scene.floorZ.get(f.id);
      const c = scene.project((b.minX + b.maxX) / 2, (b.minY + b.maxY) / 2, z);
      if (!c) continue;
      planes.push({ f: f, z: z, depth: c.depth });
    }
    planes.sort(function (a, c) {
      return c.depth - a.depth;
    });
    const planeCount = planes.length;
    const litePlanes = planeCount > 260;
    for (let i = 0; i < planeCount; i++) {
      const pl = planes[i];
      drawPlane3D(
        ctx,
        scene,
        b,
        pl.z,
        pl.f.id === scene.currentFloor,
        !litePlanes && includeGrid && idx.floors.length <= 200,
        litePlanes,
        pl.f.color || U.DEFAULT_LAYER_COLOR
      );
    }

    /* floor labels (stride-limited for very deep stacks) */
    const labelStride = Math.max(1, Math.ceil(planeCount / 200));
    for (let i = 0; i < planeCount; i++) {
      const pl = planes[i];
      if (i % labelStride !== 0 && pl.f.id !== scene.currentFloor) continue;
      const s = scene.project(b.minX - 18, b.minY + 8, pl.z);
      if (!s) continue;
      const active = pl.f.id === scene.currentFloor;
      const desc = pl.f.desc ? ' · ' + U.truncate(pl.f.desc, 12) : '';
      const text = '层 ' + g.floorDisp(pl.f.id) + desc + (pl.f.visible ? '' : ' · 隐藏');
      const color = pl.f.color || U.DEFAULT_LAYER_COLOR;
      const lx = U.clamp(s.x - 24, 54, scene.W - 54);
      const ly = U.clamp(s.y, 24, scene.H - 24);
      const badge = drawPill(ctx, text, lx, ly, {
        fontSize: 11,
        color: active ? '#1e293b' : THEME.muted,
        bg: active ? 'rgba(255,255,255,0.96)' : 'rgba(255,255,255,0.82)',
        stroke: U.rgba(color, active ? 0.9 : 0.45),
        padX: 7,
        padY: 3,
      });
      scene.floorBadges.push({ id: pl.f.id, x: badge.x, y: badge.y, w: badge.w, h: badge.h });
    }

    /* edges */
    const edges = [];
    const collect = idx.edges.length <= 20000;
    const labelsOk =
      scene.orbit.dist < 1400 ? idx.edges.length <= 1200 : idx.edges.length <= 120;
    for (let i = 0; i < idx.edges.length; i++) {
      const e = idx.edges[i];
      const a = g.points.get(e.a);
      const bpt = g.points.get(e.b);
      if (!a || !bpt) continue;
      if (!scene.visibleFloors.has(a.floor) || !scene.visibleFloors.has(bpt.floor)) continue;
      const za = scene.floorZ.get(a.floor);
      const zb = scene.floorZ.get(bpt.floor);
      const pa = scene.project(a.x, a.y, za);
      const pb = scene.project(bpt.x, bpt.y, zb);
      if (!pa || !pb) continue;
      const item = { e: e, a: pa, b: pb, depth: (pa.depth + pb.depth) / 2 };
      if (collect) edges.push(item);
      else drawEdge3D(ctx, scene, app, item, labelsOk);
    }
    if (collect) {
      edges.sort(function (x, y) {
        return y.depth - x.depth;
      });
      for (let i = 0; i < edges.length; i++) drawEdge3D(ctx, scene, app, edges[i], labelsOk);
    }

    /* nodes */
    const nodes = [];
    for (let i = 0; i < idx.points.length; i++) {
      const p = idx.points[i];
      if (!scene.visibleFloors.has(p.floor)) continue;
      const s = scene.project(p.x, p.y, scene.floorZ.get(p.floor));
      if (!s) continue;
      const r = scene.nodeRadius * s.scale;
      if (r < 0.6) continue;
      if (s.x < -r - 80 || s.x > scene.W + r + 80 || s.y < -r - 80 || s.y > scene.H + r + 80) continue;
      nodes.push({ p: p, s: s, r: r });
    }
    nodes.sort(function (x, y) {
      return y.s.depth - x.s.depth;
    });
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i];
      drawNodeScreen(ctx, scene, app, n.p, n.s.x, n.s.y, n.r);
    }
  }

  function drawEdge3D(ctx, scene, app, item, labelsOk) {
    const e = item.e;
    const aS = item.a;
    const bS = item.b;
    const selected = app.sel.has('e:' + e.id);
    const hovered = app.hover && app.hover.type === 'edge' && app.hover.id === e.id;
    const color = hovered ? THEME.hover : selected ? THEME.accent : e.color || THEME.edge;
    const baseW = scene.edgeWidth;
    if (e.a === e.b) {
      const r = Math.max(2, scene.nodeRadius * aS.scale);
      ctx.beginPath();
      ctx.arc(aS.x, aS.y - r * 1.25, r * 0.92, 0, Math.PI * 2);
      ctx.strokeStyle = color;
      ctx.lineWidth = edgeStrokeWidth(baseW, selected, hovered);
      ctx.stroke();
      if (e.directed) {
        const cy = aS.y - r * 1.25;
        const rr = r * 0.92;
        const ang = -Math.PI / 4;
        const ax = aS.x + Math.cos(ang) * rr;
        const ay = cy + Math.sin(ang) * rr;
        drawArrow(
          ctx,
          ax,
          ay,
          ang + Math.PI / 2,
          Math.max(baseW * 1.2, Math.min(80, rr * 0.35 * (0.7 + baseW / 10))),
          color
        );
      }
      if (labelsOk && scene.orbit.dist < 9000) {
        const label = edgeLabel(e);
        if (label) {
          drawPill(ctx, label, aS.x, aS.y - r * 2.17 - 10, {
            fontSize: 9,
            color: selected ? THEME.accent : THEME.muted,
            padX: 4,
            padY: 1.5,
            bg: 'rgba(255,255,255,0.78)',
          });
        }
      }
      return;
    }
    const rA = scene.nodeRadius * aS.scale;
    const rB = scene.nodeRadius * bS.scale;
    let dx = bS.x - aS.x;
    let dy = bS.y - aS.y;
    const d = Math.hypot(dx, dy);
    if (d < 1) return;
    const ux = dx / d;
    const uy = dy / d;
    const arrowGap = Math.max(0, 5 - (baseW - 2) * 0.5);
    const x1 = aS.x + ux * Math.min(rA + 1, d * 0.4);
    const y1 = aS.y + uy * Math.min(rA + 1, d * 0.4);
    const x2 = bS.x - ux * Math.min(rB + arrowGap, d * 0.4);
    const y2 = bS.y - uy * Math.min(rB + arrowGap, d * 0.4);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = edgeStrokeWidth(baseW, selected, hovered);
    ctx.stroke();
    if (e.directed) drawArrow(ctx, x2, y2, Math.atan2(dy, dx), edgeArrowSize(baseW, ((rA + rB) / 2) / 18), color);
    if (labelsOk && scene.orbit.dist < 9000 && d > 40) {
      const label = edgeLabel(e);
      if (label) {
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        drawPill(ctx, label, mx, my, {
          fontSize: 9,
          color: selected ? THEME.accent : THEME.muted,
          padX: 4,
          padY: 1.5,
          bg: 'rgba(255,255,255,0.78)',
        });
      }
    }
  }

  function drawNodeScreen(ctx, scene, app, p, sx, sy, r) {
    const g = app.graph;
    const selected = app.sel.has('p:' + p.id);
    const hovered = app.hover && app.hover.type === 'point' && app.hover.id === p.id;
    const fill = p.color || '#000000';
    if (selected) {
      ctx.beginPath();
      ctx.arc(sx, sy, r * 1.18, 0, Math.PI * 2);
      ctx.strokeStyle = THEME.accent;
      ctx.lineWidth = Math.max(2, r * 0.09);
      ctx.stroke();
    }
    if (hovered) {
      ctx.beginPath();
      ctx.arc(sx, sy, r * 1.26, 0, Math.PI * 2);
      ctx.strokeStyle = THEME.hover;
      ctx.lineWidth = Math.max(1.5, r * 0.06);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.strokeStyle = U.luminance(fill) > 0.8 ? '#cbd5e1' : 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    scene.nodeHits.push({ id: p.id, x: sx, y: sy, r: Math.max(r + 4, 6) });

    if (r >= 6) {
      const idText = String(g.pointDisp(p.id));
      const fs = Math.min(26, Math.max(6, r * 0.58));
      ctx.font = font(fs, 600);
      const tw = ctx.measureText(idText).width;
      const shrink = Math.min(1, (r * 1.5) / Math.max(1, tw));
      ctx.font = font(Math.max(5.5, fs * shrink), 600);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = U.contrastText(fill);
      const hasWeight = p.weight != null && r >= 9;
      ctx.fillText(idText, sx, sy + (hasWeight ? -r * 0.16 : 0));
      if (hasWeight) {
        ctx.font = font(Math.max(5.5, Math.min(17, r * 0.32)), 500);
        ctx.fillStyle = U.contrastText(fill);
        ctx.globalAlpha = 0.92;
        ctx.fillText(U.weightText(p.weight), sx, sy + r * 0.46);
        ctx.globalAlpha = 1;
      }
    }
    if (r >= 11 && p.desc) {
      const df = Math.min(14, Math.max(8, r * 0.3));
      haloText(ctx, U.truncate(p.desc, 5), sx, sy + r + df * 0.9, THEME.muted, df, 500);
    }
  }

  /* ------------------------------------------------------------------ *
   * Fit / spacing helpers
   * ------------------------------------------------------------------ */

  function fit2D(bounds, W, H, padding, maxScale) {
    const pad = padding == null ? 80 : padding;
    const bw = Math.max(1, bounds.maxX - bounds.minX);
    const bh = Math.max(1, bounds.maxY - bounds.minY);
    const cap = maxScale == null ? 2.2 : maxScale;
    const scale = U.clamp(Math.min((W - pad * 2) / bw, (H - pad * 2) / bh), 0.02, cap);
    return {
      x: (bounds.minX + bounds.maxX) / 2,
      y: (bounds.minY + bounds.maxY) / 2,
      scale: scale,
    };
  }

  function computeSpacing(floors, maxPerFloor) {
    if (floors <= 1) return 0;
    const fit = 3200 / (floors - 1);
    const density = 150 + Math.min(130, Math.sqrt(maxPerFloor || 1) * 6);
    return U.clamp(Math.min(density, fit), 34, 340);
  }

  function targetSpacing(graph) {
    const idx = graph.getIndex();
    let maxPerFloor = 0;
    for (let i = 0; i < idx.floors.length; i++) {
      const arr = idx.byFloor.get(idx.floors[i].id);
      if (arr && arr.length > maxPerFloor) maxPerFloor = arr.length;
    }
    return computeSpacing(idx.floors.length, maxPerFloor);
  }

  function fitView(app, W, H, opts) {
    opts = opts || {};
    const view = opts.view || app.view;
    const g = app.graph;
    const idx = g.getIndex();
    if (!idx.floors.length) return;
    if (view.mode === '2d') {
      const fid = idx.floors.some(function (f) {
        return f.id === view.currentFloor;
      })
        ? view.currentFloor
        : idx.floors[0].id;
      view.currentFloor = fid;
      const pts = (idx.byFloor.get(fid) || []).filter(function (p) {
        return p.x != null;
      });
      const b = GE.Layout.bounds(pts);
      view.cam = fit2D(b, W, H, opts.padding == null ? 90 : opts.padding, opts.maxScale);
      view.fitTween = null;
    } else {
      const includeHidden = !!opts.includeHidden;
      const visibleFloors = new Set();
      for (let i = 0; i < idx.floors.length; i++) {
        if (includeHidden || idx.floors[i].visible) visibleFloors.add(idx.floors[i].id);
      }
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      let count = 0;
      for (let i = 0; i < idx.points.length; i++) {
        const p = idx.points[i];
        if (!visibleFloors.has(p.floor) || p.x == null) continue;
        count++;
        if (p.x < minX) minX = p.x;
        if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.y > maxY) maxY = p.y;
      }
      if (!count) {
        minX = -200;
        maxX = 200;
        minY = -200;
        maxY = 200;
      }
      const zSpan = Math.max(0, (idx.floors.length - 1) * view.spacing);
      const cx = (minX + maxX) / 2;
      const cy = (minY + maxY) / 2;
      const radius = Math.max(140, 0.5 * Math.hypot(maxX - minX, maxY - minY, zSpan));
      view.orbit.tx = cx;
      view.orbit.ty = cy;
      view.orbit.tz = 0;
      view.orbit.dist = U.clamp((radius / Math.sin(FOV / 2)) * 1.12, 260, 90000);
    }
  }

  /* ------------------------------------------------------------------ *
   * Entry point
   * ------------------------------------------------------------------ */

  function draw(app, ctx, W, H, opts) {
    opts = opts || {};
    const view = opts.view || app.view;
    const exporting = !!opts.exporting;
    const dpr = opts.dpr || 1;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (!opts.transparent) {
      ctx.fillStyle = opts.background || THEME.bg;
      ctx.fillRect(0, 0, W, H);
    }
    const scene =
      view.mode === '3d' ? make3DScene(app, W, H, view, opts) : make2DScene(app, W, H, view);
    if (view.mode === '3d') {
      draw3D(app, ctx, scene, view, opts);
    } else {
      if (opts.includeGrid != null ? opts.includeGrid : view.showGrid) drawGrid2D(ctx, scene);
      draw2D(app, ctx, scene, view, opts);
    }
    if (!exporting) {
      if (app.boxSelect) {
        const r = app.boxSelect;
        const x = Math.min(r.x0, r.x1);
        const y = Math.min(r.y0, r.y1);
        const w = Math.abs(r.x1 - r.x0);
        const h = Math.abs(r.y1 - r.y0);
        ctx.fillStyle = 'rgba(79,70,229,0.08)';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(79,70,229,0.75)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(x + 0.5, y + 0.5, w, h);
        ctx.setLineDash([]);
      }
      app.pick = scene;
    }
    ctx.restore();
  }

  GE.Render = {
    draw: draw,
    fitView: fitView,
    fit2D: fit2D,
    computeSpacing: computeSpacing,
    targetSpacing: targetSpacing,
    gridStep: gridStep,
    THEME: THEME,
    NODE_R: NODE_R,
    FOV: FOV,
  };
})(globalThis.GE = globalThis.GE || {});
